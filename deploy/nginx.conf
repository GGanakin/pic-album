# Copy the CONTENTS of the portable package's site/ directory to this web root.
# Replace album.example.com with your domain or your server's public IP.
server {
    listen 80;
    server_name album.example.com;

    root /var/www/wedding-album;
    index index.html;
    charset utf-8;
    autoindex off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ =404;
    }

    # Filenames are not fingerprinted, so changes to the UI should revalidate.
    location ~* \.(?:html|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:jpg|jpeg|webp|png|svg|woff2)$ {
        try_files $uri =404;
        expires 7d;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
